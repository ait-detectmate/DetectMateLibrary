[project]
name = "detectmatelibrary"
description = "DetectMate Library for log processing components"
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["version"]
authors = [{"name" = "André García Gómez"}, {"name" = "Viktor Beck"}, {"name" = "Thorina Boenke"},
    {"name" = "Wolfgang Hotwagner"}, {"name" = "Anna Erdi"}, {"name" = "Ernst Leierzopf"}, {"name" = "Lukas Karner"}]
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=6.32.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "regex>=2025.11.3",
    "numpy>=2.3.2",
    "detectmateperformance>=0.2.0",
    "msgpack>=1.0.0",
    "fsspec>=2024.1.0",
    "pyarrow>=24.0.0",
    "jax>=0.11.0",
    "flax>=0.12.8",
    "optax>=0.2.8",
    "polars>=1.40.1",
    "polars[rtcompat]>=1.38.1",
    "pymongo>=4.19.0",
    "redis[hiredis]>=8.1.0",
]

[tool.pytest.ini_options]
# The only pytest configuration: there is no pytest.ini (it would shadow this table).
testpaths = ["tests"]
# Default run: everything except the opt-in groups below. `-m ""` runs everything (what CI does).
addopts = "--strict-markers --strict-config --ignore=local -ra -m 'not slow and not cli and not docs'"
xfail_strict = true
markers = [
    "unit: tests one source module (applied automatically to tests/unit/)",
    "contract: shared-interface suite over all implementations (applied automatically to tests/contract/)",
    "integration: several real components together (applied automatically to tests/integration/)",
    "e2e: raw logs to alerts through public entry points (applied automatically to tests/e2e/)",
    "slow: takes more than 2 s; opt-in locally (-m slow), always run in CI",
    "cli: runs the installed `mate` console script in a subprocess; opt-in locally, always run in CI",
    "docs: runs a file from docs/examples/; opt-in locally, always run in CI",
    "needs_cxx: needs a C++ compiler for torch.compile; skipped locally without one, fails in CI",
    "needs_mongo: needs MongoDB (docker compose -f tests/compose.yaml up -d); skipped locally if unreachable, fails in CI",
    "needs_redis: needs Redis (docker compose -f tests/compose.yaml up -d); skipped locally if unreachable, fails in CI",
]

[dependency-groups]
# install with all the dev dependencies:  uv pip install --group dev
dev = [
    "mike>=2.2.0",
    "prek>=0.3.10",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pymdown-extensions>=10.0",
    "detectmatelibrary[full]",
    "mkdocs-material>=9.7.7",
]

[project.optional-dependencies]
llm = [
    "openai>=2.26.0",
    "tenacity>=9.1.4",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "tiktoken>=0.12.0",
    "pandas>=2.3.2",
]
alertbert = [
    "torch",
    "tensordict",
    "scikit-learn",
    "scipy",
]
# install all optional extras at once:  uv pip install detectmatelibrary[full]
full = [
    "detectmatelibrary[llm]",
    "detectmatelibrary[alertbert]",
]

[tool.setuptools.dynamic]
version = {attr = "detectmatelibrary.metadata.__version__"}

[project.urls]
Homepage = "https://ait-detectmate.github.io/DetectMateLibrary/latest"
Repository = "https://github.com/ait-detectmate/DetectMateLibrary"

[build-system]
requires = ["setuptools>=84.1.0", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mate = "detectmatelibrary.tools.workspace.create_workspace:main"

[[tool.mypy.overrides]]
module = "detectmatelibrary.schemas.protobuf.schemas_pb2"
ignore_errors = true

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.md"]

[tool.setuptools.package-data]
detectmatelibrary = [
    "tools/workspace/templates/data/*.json"
]

[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "alertbert" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

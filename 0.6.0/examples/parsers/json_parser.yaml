parsers:
  JsonParser:
    method_type: json_parser
    params:
      timestamp_name: time            # JSON key holding the timestamp
      content_name: message           # JSON key holding the free-text message
      content_parser: JsonMatcherParser   # parser (defined below) applied to the message
  JsonMatcherParser:
    method_type: matcher_parser
    params:
      path_templates: tests/test_data/test_templates.txt

site_name: DetectMate Library
site_url: https://ait-detectmate.github.io/DetectMateLibrary/

theme:
  name: material # windmill is auch cool
  palette:
    # Light mode configuration
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode configuration
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode


nav:
  - Home: index.md

  - User Guide:
    - What is DetectMate?: user_guide/what_is_detectmate.md
    - Installation: user_guide/installation.md
    - Basic knowledge: user_guide/basic_knowledge.md
    - Quickstart: user_guide/quickstart.md
    - Tutorial (end-to-end): user_guide/tutorial.md

  - Advanced Guide:
    - Overall architecture: advanced/overall_architecture.md
    - Components:
      - Schemas: schemas.md
      - Federation: federation.md
      - Parsers: parsers.md
      - Detectors: detectors.md
      - Alert Aggregation: alert_aggregator.md
    - Parser types:
      - Auto Parser: parsers/auto_parser.md
      - Drain Parser: parsers/drain_parser.md
      - JSON Parser: parsers/json_parser.md
      - LogBatcher Parser: parsers/logbatcher_parser.md
      - Template Matcher: parsers/template_matcher.md
      - Template Tree Matcher: parsers/template_tree_matcher.md
    - Detector types:
      - Random Detector: detectors/random_detector.md
      - Rule Detector: detectors/rule_based.md
      - New Event Detector: detectors/new_event.md
      - New Value Detector: detectors/new_value.md
      - New Value Combo Detector: detectors/combo.md
      - Value Range Detector: detectors/value_range.md
      - Charset Detector: detectors/charset.md
      - Event Sequence Detector: detectors/event_sequence.md
      - Bigram Frequency Detector: detectors/bigram_frequency.md
      - SCVS Detector: detectors/scvs_detector.md
      - ECVC Detector: detectors/ecvc_detector.md
      - DeepLog Detector: detectors/deeplog.md
      - LogBERT Detector: detectors/logbert.md
    - Alert Aggregation methods:
      - Basic Concat: alert_aggregators/basic_concatenation.md
    - Helpers:
      - FromTo: helper/from_to.md
    - Auxiliary:
      - Persistency: auxiliar/persistency.md
      - Data buffer: auxiliar/input_buffer.md
    - Other:
      - Log Formats: other/log_formats.md

  - How to contribute:
    - Contributing: contribution.md
    - Development: development.md
    - Release Process: release.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
